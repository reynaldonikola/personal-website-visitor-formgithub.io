<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Theme Park Deals</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div class="container">
        <h1>Get Exclusive Theme Park Discounts</h1>
        <p>Sign up to receive special offers for Disneyland and Universal Studios!</p>

        <form id="visitorForm">
            <label>Full Name:</label>
            <input type="text" id="name">

            <label>Email:</label>
            <input type="email" id="email">

            <label>Phone:</label>
            <input type="text" id="phone">

            <label>Number of Visitors:</label>
            <input type="number" id="visitors">

            <label>Travel Month:</label>
            <select id="month">
                <option value="">Select Month</option>
                <option>January</option>
                <option>February</option>
                <option>March</option>
                <option>April</option>
                <option>May</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
                <option>December</option>
            </select>

            <label>Park:</label>
            <select id="park">
                <option value="">Select Park</option>
                <option>Disneyland</option>
                <option>California Adventure</option>
                <option>Universal Studios Hollywood</option>
            </select>

            <label>Type of Deal:</label>
            <select id="deal">
                <option value="">Select Option</option>
                <option>Tickets Discount</option>
                <option>Hotel + Tickets</option>
                <option>Family Package</option>
            </select>

            <button type="submit">Get Deals</button>
        </form>

        <p id="message"></p>
    </div>

    <script src="validation.js"></script>
    <script src="main.js"></script>
</body>
</html>
