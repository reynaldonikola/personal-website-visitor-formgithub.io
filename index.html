<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visitor Registration Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <p class="eyebrow">Personal Website Project</p>
      <h1>Visitor Registration Form</h1>
      <p class="hero-text">Please complete the form below to register your visit. This project includes responsive design, real-time validation, and clear visual feedback.</p>
    </div>
  </header>

  <main class="container">
    <section class="form-card">
      <div class="card-header">
        <h2>Register Here</h2>
        <p>All required fields must be completed before submission.</p>
      </div>

      <form id="visitorForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name <span>*</span></label>
          <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
          <small class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="email">Email Address <span>*</span></label>
          <input type="email" id="email" name="email" placeholder="example@email.com">
          <small class="error-message"></small>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone Number <span>*</span></label>
            <input type="text" id="phone" name="phone" placeholder="123-456-7890">
            <small class="error-message"></small>
          </div>

          <div class="form-group">
            <label for="zip">ZIP Code <span>*</span></label>
            <input type="text" id="zip" name="zip" placeholder="84095">
            <small class="error-message"></small>
          </div>
        </div>

        <div class="form-group">
          <label for="state">State <span>*</span></label>
          <select id="state" name="state">
            <option value="">Select a state</option>
            <option value="UT">Utah</option>
            <option value="CA">California</option>
            <option value="TX">Texas</option>
            <option value="FL">Florida</option>
            <option value="NY">New York</option>
            <option value="NV">Nevada</option>
            <option value="AZ">Arizona</option>
            <option value="CO">Colorado</option>
          </select>
          <small class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="visitReason">Reason for Visit</label>
          <textarea id="visitReason" name="visitReason" rows="4" placeholder="Write a short message"></textarea>
          <small class="error-message"></small>
        </div>

        <div class="button-group">
          <button type="submit" class="primary-btn">Submit</button>
          <button type="reset" id="clearBtn" class="secondary-btn">Clear</button>
        </div>

        <p id="successMessage" class="success-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>Created by Reynaldo Moros</p>
  </footer>

  <script src="validation.js"></script>
  <script src="main.js"></script>
</body>
</html>
